<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giallovision | Nodes</title>
    <link rel="icon" type="image/png" href="favicon.png?v=2">
    <link rel="shortcut icon" href="favicon.png?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/litegraph.js/css/litegraph.css">
    <link rel="stylesheet" href="./css/global.css">
    
    <style>
        body { background-color: #202020; margin: 0; padding: 0; overflow: hidden; font-family: 'Roboto', sans-serif; }
        #mycanvas { width: 100vw; height: 100vh; display: block; }

        @media (max-width: 768px) {
            #mycanvas { touch-action: none !important; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
            /* Moved from bottom to top: 75px (clears the 60px navbar + 15px margin) */
            .mobile-zoom-controls { position: fixed; top: 75px; right: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 101; }
            .mobile-zoom-btn { background: rgba(9, 14, 19, 0.8); border: 1px solid #00b4d8; color: #00b4d8; width: 45px; height: 45px; border-radius: 50%; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(5px); box-shadow: 0 0 10px rgba(0, 180, 216, 0.2); }
        }
        @media (min-width: 769px) { .mobile-zoom-controls { display: none; } }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="nav-logo">GIALLOVISION // <span>CORE</span></div>
        <div class="nav-links">
            <a href="/" class="nav-item">Work</a>
            <!-- <a href="/design" class="nav-item">Design</a> -->
            <a href="/services" class="nav-item">Services</a>
            <a href="/nodes" class="nav-item">Nodes</a>
            <a href="/about" class="nav-item">About</a>
            <a href="#contact" class="back-btn" data-modal="contact">Contact</a>
        </div>
    </nav>

    <div class="mobile-zoom-controls">
        <button class="mobile-zoom-btn" onclick="window.zoomCanvas(1.25)">+</button>
        <button class="mobile-zoom-btn" onclick="window.zoomCanvas(0.8)">-</button>
    </div>

    <canvas id="mycanvas"></canvas>

    <script>var submitted = false;</script>
    <script src="https://unpkg.com/litegraph.js/build/litegraph.js"></script>
    <script type="module" src="./src/main.js"></script>
    <script src="./src/contact_modal.js" defer></script>
    <script src="./src/l4g0tt0.js?v=4" defer></script>
</body>
</html>
